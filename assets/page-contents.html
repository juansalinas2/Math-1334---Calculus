<script>
document.addEventListener('DOMContentLoaded', () => {
  const main = document.querySelector('main.content');
  const toolbar = document.querySelector('.reading-controls');
  const headings = [...(main?.querySelectorAll('section.level2 > h2') || [])]
    .filter(heading => heading.parentElement.id);
  if (!main || !toolbar || headings.length < 3) return;
  const details = document.createElement('details');
  details.className = 'reading-menu reading-contents';
  const summary = document.createElement('summary');
  summary.textContent = 'On this page';
  const list = document.createElement('ul');
  list.className = 'reading-options reading-section-list';
  for (const heading of headings) {
    const item = document.createElement('li');
    const link = document.createElement('a');
    link.href = '#' + heading.parentElement.id;
    link.textContent = heading.textContent.trim();
    link.addEventListener('click', () => {
      details.open = false;
      heading.setAttribute('tabindex', '-1');
      heading.focus({preventScroll: true});
    });
    item.append(link); list.append(item);
  }
  details.append(summary, list);
  toolbar.querySelector('.reading-action').before(details);
  details.addEventListener('keydown', event => {
    if (event.key === 'Escape') { details.open = false; summary.focus(); }
  });
  document.addEventListener('click', event => {
    if (!details.contains(event.target)) details.open = false;
  });
  // Keep only one reading menu open, including when using the keyboard.
  for (const menu of toolbar.querySelectorAll('.reading-menu')) {
    menu.addEventListener('toggle', () => {
      if (menu.open) for (const other of toolbar.querySelectorAll('.reading-menu')) {
        if (other !== menu) other.open = false;
      }
    });
  }
});
function openLinkedProof() {
  let id;
  try { id = decodeURIComponent(location.hash.slice(1)); } catch (_) { return; }
  if (!id) return;
  const target = document.getElementById(id);
  let opened = false;
  for (let el = target; el; el = el.parentElement) {
    if (el.tagName === 'DETAILS' && !el.open) { el.open = true; opened = true; }
  }
  if (opened) requestAnimationFrame(() => target.scrollIntoView());
}
window.addEventListener('hashchange', openLinkedProof);
window.addEventListener('load', openLinkedProof);
</script>
