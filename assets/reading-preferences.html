<script>
// Preserve the locally hosted TeX renderer and its Computer Modern math fonts.
window.MathJax = {
  output: {
    font: 'mathjax-newcm',
    fontPath: new URL((document.querySelector('meta[name="quarto:offset"]')?.content || './') + 'assets/mathjax-4.1.3/mathjax-newcm-font', location.href).href
  }
};
(() => {
  const root = document.documentElement;
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  const desktop = window.matchMedia('(min-width: 768px)');
  const key = 'calculus-notes-reading';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key)) || {}; } catch (_) {}
  let theme = ['system', 'light', 'paper', 'dark', 'darker'].includes(saved.theme) ? saved.theme : 'system';
  let size = ['small', 'standard', 'large', 'xlarge', 'xxlarge'].includes(saved.size) ? saved.size : 'xlarge';
  // Upgrade the old default while retaining other saved size choices.
  if (saved.sizeVersion !== 2 && size === 'standard') size = 'xlarge';
  let mobileSize = ['small', 'standard', 'large', 'xlarge', 'xxlarge'].includes(saved.mobileSize) ? saved.mobileSize : 'standard';
  let sidebarCollapsed = saved.sidebarCollapsed === true;
  let mobileOpen = false;
  root.classList.add('reading-layout');
  function apply() {
    root.dataset.readingTheme = theme === 'system' ? (system.matches ? 'dark' : 'light') : theme;
    root.dataset.readingSize = desktop.matches ? size : mobileSize;
    root.dataset.sidebarCollapsed = String(sidebarCollapsed);
    root.dataset.mobileMenu = String(mobileOpen);
  }
  function save() {
    apply();
    try { localStorage.setItem(key, JSON.stringify({theme, size, mobileSize, sizeVersion: 2, sidebarCollapsed})); } catch (_) {}
  }
  apply();
  system.addEventListener('change', apply);
  const stylesheet = document.querySelector('#quarto-bootstrap');
  function recoverStyles() {
    if (!stylesheet || getComputedStyle(root).getPropertyValue('--reading-bg').trim()) return;
    stylesheet.href = new URL((document.querySelector('meta[name="quarto:offset"]')?.content || './') + 'site_libs/bootstrap/reading-theme.css', location.href).href;
  }
  stylesheet?.addEventListener('error', recoverStyles, {once: true});
  window.addEventListener('load', recoverStyles, {once: true});
  document.addEventListener('DOMContentLoaded', () => {
    const main = document.querySelector('main.content');
    const header = main?.querySelector(':scope > header');
    const sidebar = document.getElementById('quarto-sidebar');
    if (!main || !header || !sidebar) return;
    root.dataset.homepage = String(!!main.querySelector('.course-home'));
    if (main.querySelector('.course-home')) header.querySelector('h1').textContent = 'Calculus 1';
    const controls = document.createElement('header');
    controls.className = 'reading-controls';
    controls.setAttribute('aria-label', 'Site navigation and appearance');
    const brand = document.createElement('div'); brand.className = 'reading-brand';
    const toggle = document.createElement('button');
    toggle.type = 'button'; toggle.className = 'reading-sidebar-toggle';
    toggle.setAttribute('aria-controls', 'quarto-sidebar');
    const icon = document.createElement('i'); icon.className = 'bi bi-layout-sidebar'; icon.setAttribute('aria-hidden', 'true');
    toggle.append(icon);
    function syncToggle() {
      const expanded = desktop.matches ? !sidebarCollapsed : mobileOpen;
      toggle.setAttribute('aria-label', expanded ? 'Collapse contents' : 'Show contents');
      toggle.setAttribute('aria-expanded', String(expanded));
      sidebar.inert = !expanded;
    }
    toggle.addEventListener('click', () => {
      if (desktop.matches) sidebarCollapsed = !sidebarCollapsed;
      else mobileOpen = !mobileOpen;
      save(); syncToggle(); window.dispatchEvent(new Event('resize'));
      if (!desktop.matches && mobileOpen) requestAnimationFrame(() => { sidebar.scrollIntoView({block:'start', behavior:'instant'}); sidebar.scrollTop = 0; });
    });
    desktop.addEventListener('change', () => { mobileOpen = false; apply(); syncToggle(); });
    syncToggle();
    const context = document.createElement('a'); context.className = 'reading-context';
    context.href = (document.querySelector('meta[name="quarto:offset"]')?.content || './') + 'index.html';
    context.textContent = 'Calculus notes'; brand.append(toggle, context); controls.append(brand);
    const search = document.createElement('button'); search.type = 'button'; search.className = 'reading-action reading-search';
    search.setAttribute('aria-label', 'Search course notes');
    const searchIcon = document.createElement('i'); searchIcon.className = 'bi bi-search'; searchIcon.setAttribute('aria-hidden', 'true');
    const searchLabel = document.createElement('span'); searchLabel.textContent = 'Search notes…';
    const shortcut = document.createElement('kbd'); shortcut.textContent = '/'; shortcut.setAttribute('aria-hidden', 'true');
    search.append(searchIcon, searchLabel, shortcut);
    search.addEventListener('click', () => window.quartoOpenSearch?.()); controls.append(search);
    const settings = document.createElement('button'); settings.type = 'button'; settings.className = 'reading-action reading-appearance';
    settings.textContent = 'Appearance'; settings.setAttribute('aria-controls', 'reading-appearance-options');
    const options = document.createElement('div'); options.className = 'reading-options'; options.id = 'reading-appearance-options';
    options.setAttribute('role', 'region'); options.setAttribute('aria-label', 'Reading appearance');
    function setAppearance(open) { options.hidden = !open; settings.setAttribute('aria-expanded', String(open)); }
    setAppearance(false); controls.append(settings, options);
    settings.addEventListener('click', () => setAppearance(options.hidden));
    document.addEventListener('click', event => { if (!options.contains(event.target) && !settings.contains(event.target)) setAppearance(false); });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (!options.hidden) { setAppearance(false); settings.focus(); }
        else if (mobileOpen) { mobileOpen = false; apply(); syncToggle(); toggle.focus(); }
      }
    });
    function select(labelText, values, current, onChange) {
      const label = document.createElement('label'); label.textContent = labelText;
      const input = document.createElement('select'); input.setAttribute('aria-label', labelText);
      for (const [value, text] of values) input.add(new Option(text, value));
      input.value = current;
      input.addEventListener('change', () => { onChange(input.value); save(); window.dispatchEvent(new Event('resize')); });
      label.append(input); options.append(label);
      return input;
    }
    select('Theme', [['system','System'],['light','Light'],['paper','Paper'],['dark','Dark'],['darker','Darker']], theme, value => { theme = value; });
    const sizeInput = select('Text size', [['small','16 px'],['standard','18 px'],['large','20 px'],['xlarge','22 px'],['xxlarge','24 px']], desktop.matches ? size : mobileSize, value => { if (desktop.matches) size = value; else mobileSize = value; });
    function syncScreenControls() {
      sizeInput.value = desktop.matches ? size : mobileSize;
      for (const option of sizeInput.options) {
        const px = {small:16, standard:18, large:20, xlarge:22, xxlarge:24}[option.value];
        option.textContent = px + ' px' + (option.value === (desktop.matches ? 'xlarge' : 'standard') ? ' · default' : '');
      }
      if (desktop.matches) controls.insertBefore(search, settings);
      else sidebar.prepend(search);
    }
    syncScreenControls(); desktop.addEventListener('change', syncScreenControls);
    document.getElementById('quarto-content').before(controls);
    if ('ResizeObserver' in window) new ResizeObserver(() => root.style.setProperty('--reading-header-height', controls.offsetHeight + 'px')).observe(controls);
    if (!main.id) main.id = 'reading-main'; main.setAttribute('tabindex', '-1');
    const skip = document.createElement('a'); skip.className = 'reading-skip'; skip.href = '#' + main.id; skip.textContent = 'Skip to notes';
    skip.addEventListener('click', () => main.focus({preventScroll:true})); document.body.prepend(skip);
    const top = document.createElement('a'); top.className = 'reading-back-top'; top.href = '#' + header.id; top.textContent = 'Back to top ↑';
    top.addEventListener('click', () => { header.setAttribute('tabindex','-1'); header.focus({preventScroll:true}); });
    if (!main.querySelector('.course-home')) main.append(top);
  });
})();
</script>
