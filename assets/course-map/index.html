<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f9f8f2">
    <script src="./theme.js"></script>
    <title>Calculus concept map · MATH 1334</title>
    <link rel="stylesheet" href="./map.css">
    <link rel="stylesheet" href="./math.css">
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./systems.css">
    <link rel="stylesheet" href="./orbit.css">
    <script defer src="./vendor/d3.v7.min.js"></script>
    <script defer src="./topics.js"></script>
    <script defer src="./graph.js"></script>
    <script defer src="./sizes.js"></script>
    <script defer src="./orbit.js"></script>
    <script defer src="./interior.js"></script>
    <script defer src="./systems.js"></script>
    <script defer src="./search.js"></script>
    <script defer src="./topic-list.js"></script>
    <script defer src="./labels.js"></script>
    <!-- practice data -->
    <script defer src="./practice.js"></script>
    <script defer src="./note-sheet.js"></script>
    <script defer src="./definition-view.js"></script>
    <script defer src="./map.js"></script>
  </head>
  <body data-map-layout="focus">
    <header>
      <div class="mainbar">
        <div class="identity">
          <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
            <rect width="48" height="48" rx="12" fill="#193b3c" />
            <path
              d="M6 33h9l13-18h14M7 16h8l13 18h13"
              fill="none"
              stroke="#ecd99a"
              stroke-width="3"
            />
            <circle
              cx="22"
              cy="24"
              r="4"
              fill="#193b3c"
              stroke="white"
              stroke-width="2"
            />
          </svg>
          <div>
            <a class="back" href="../"
            >← MATH 1334 course notes</a><h1>Calculus concept map</h1>
          </div>
        </div>
        <div class="searchbox">
          <label for="lookup"><span aria-hidden="true">⌕</span><span class="sr"
            >Find a concept</span></label><input
            id="lookup"
            type="search"
            placeholder="Topic or symbol…"
            autocomplete="off"
            aria-controls="results"
          ><div id="results" hidden></div>
        </div>
        <div class="presentation-switch" role="group" aria-label="Browse concepts">
          <button type="button" data-presentation="map" aria-pressed="true">Zoom map</button>
          <button type="button" data-presentation="list" aria-pressed="false">Topic list</button>
        </div>
        <label class="map-theme-control" title="Theme"><span>Theme</span><select id="map-theme" aria-label="Map theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option><option value="paper">Paper</option><option value="darker">Darker</option></select></label>
      </div>
      <nav aria-label="Focus the map by topic">
        <button class="family overview" data-family="all" aria-pressed="true">
          Whole map
        </button><span id="families"></span>
      </nav>
      <nav id="trail" hidden aria-label="Map breadcrumb"></nav>
    </header>
    <main>
      <section class="stage" aria-label="Interactive calculus map">
        <div
          id="canvas"
          tabindex="0"
          role="group"
          aria-label="Course concepts. Drag to pan, or use arrow keys. Use plus and minus to zoom. Double-click or double-tap empty map space to exit a path."
        >
          <svg id="drawing" width="100%" height="100%" aria-label="Concept graph">
          <!-- node marks -->
          <g id="world">
            <g id="rails"></g>
            <g id="stops"></g>
            <g id="subtopic-orbit" role="group" display="none"></g>
          </g>
          </svg>
          <div id="systems" role="group" hidden>
            <svg id="system-lines" aria-hidden="true" width="100%" height="100%"></svg>
            <div id="system-nodes"></div>
          </div>
          <button id="locator" type="button" title="Return to the whole map" aria-label="Return to the whole map" hidden><svg id="locator-plot" aria-hidden="true"></svg></button>
        </div>
        <section id="topic-list" aria-label="Topics and subtopics" hidden><a class="game-entry" href="./challenge.html">Play Critical Point</a></section>
        <div class="explore-tools" id="explore-tools">
          <details class="class-questions" id="class-questions">
            <summary>Start with a question <span aria-hidden="true">↗</span></summary>
            <div class="question-list">
              <a href="#limitmethods">Which limit method should I try?</a>
              <a href="#ivt/does-the-equation-have-a-solution">Does the equation have a solution?</a>
              <a href="#optimization/folding-a-box">Which box has the greatest volume?</a>
            </div>
          </details>
          <a class="game-entry" href="./challenge.html">Play Critical Point</a>
          <span class="gesture-hint">Select a concept · Drag to move · Zoom for detail</span>
        </div>
        <div class="controls" aria-label="Map controls">
          <button id="out" disabled aria-label="Zoom out" title="Zoom out">
            −
          </button><output
            id="zoom-level"
            aria-label="Zoom level"
            aria-live="off"
          >…</output><button
            id="in"
            disabled
            aria-label="Zoom in"
            title="Zoom in"
          >
            +
          </button>
          <button id="fit" title="Fit whole map" aria-label="Fit whole map">
            Fit map
          </button>
          <details id="map-sizes">
            <summary aria-label="Node sizes">Sizes</summary>
            <div class="map-size-menu">
              <label for="topic-size">Concepts</label>
              <span id="topic-size-value" aria-hidden="true">100%</span>
              <input id="topic-size" type="range" min="100" max="250" step="5" value="100" aria-valuetext="100%">
              <label for="subtopic-size">Subtopics</label>
              <span id="subtopic-size-value" aria-hidden="true">100%</span>
              <input id="subtopic-size" type="range" min="100" max="250" step="5" value="100" aria-valuetext="100%">
            </div>
          </details>
          <button id="exit-path" hidden title="Exit path (Esc)">Exit path</button>
        </div>
        <output id="map-level" aria-live="polite" aria-atomic="true"></output>
      </section>
      <aside id="detail" hidden aria-label="Selected concept">
        <div id="reader">
          <div class="reader-tools" id="reader-tools">
            <button id="sheet-toggle" aria-expanded="false" aria-controls="detail-body">Read note</button>
            <span id="reader-label"></span>
            <button id="close" title="Up one level" aria-label="Up one level">×</button>
          </div>
          <div id="detail-body"></div>
        </div>
      </aside>
    </main>
    <dialog id="zoom-definition" aria-labelledby="definition-title">
      <div class="definition-tools">
        <button type="button" id="definition-back">← Back to map</button>
        <kbd aria-hidden="true">Esc</kbd>
      </div>
      <div class="definition-page">
        <article>
          <p id="definition-context"></p>
          <h2 id="definition-title" tabindex="-1" autofocus></h2>
          <div id="definition-text"></div>
        </article>
      </div>
    </dialog>
    <noscript><p>
        This map needs JavaScript for zoom and navigation. <a
          href="../supplements/limits-map.html"
        >Read the concept guide.</a>
      </p></noscript>
  </body>
</html>
