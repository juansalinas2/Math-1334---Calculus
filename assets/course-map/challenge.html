<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b22">
<title>Junction Run · Calculus concept map</title>
<link href="./math.css" rel="stylesheet"><link href="./challenge.css" rel="stylesheet">
<script defer src="./challenge.js"></script>
</head><body data-bank="./challenge-bank.json">
<div class="cabinet">
<header><a class="back" href="./">‹ Concept map</a><span>MATH 1334</span></header>
<main>
<div class="mast"><h1>Junction <em>Run</em></h1><div class="record">Best streak <b id="record">0</b></div></div>
<div class="console">
<div class="display">
  <div class="scorebar"><span id="round">At the station</span><span id="score">Streak <b>0</b></span></div>
  <svg id="rails" viewBox="0 0 680 186" role="img" aria-label="Rail junction with four tracks labeled A through D" preserveAspectRatio="xMidYMid meet">
    <defs>
      <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" fill="#44615d"/></pattern>
      <pattern id="sleepers" width="13" height="10" patternUnits="userSpaceOnUse"><path d="M2 0v10" stroke="#8baba1" stroke-width="3"/></pattern>
    </defs>
    <rect width="680" height="186" fill="url(#grid)"/>
    <g id="tracks"></g>
    <g id="car" transform="translate(56 94)">
      <path d="M-22 0h-17m20-6h-12m12 12h-9" fill="none" stroke="#f4c36b" stroke-width="2"/>
      <path d="M-18-8h21l13 7v6h-34z" fill="#ffe6a1" stroke="#101b22" stroke-width="2"/>
      <path d="M-6-5h8l8 4H-6z" fill="#233d45"/><path d="M-15 2H9" stroke="#ca6b46" stroke-width="2"/>
      <circle cx="-11" cy="6" r="3" fill="#162329" stroke="#f6c77e"/><circle cx="9" cy="6" r="3" fill="#162329" stroke="#f6c77e"/>
    </g>
  </svg>
</div>
<div id="panel">
  <section id="lobby"><h2>Choose your line</h2><p>Steer the train with your answers. A miss ends the run. Get three right to earn a signal that closes two wrong tracks.</p>
    <label for="line">Lecture</label><select id="line" disabled><option value="mixed">Mixed review</option></select>
    <button class="primary" id="start" disabled>Start run</button><p id="load-state" role="status">Loading questions…</p>
  </section>
  <section id="play" hidden><h2 id="prompt" tabindex="-1"></h2><div class="choices" id="choices"></div>
    <button id="signal" class="quiet" hidden>Use signal · close two tracks</button>
  </section>
  <section id="feedback" hidden><h2 id="verdict" tabindex="-1"></h2><div id="result"></div><div class="actions"><button class="primary" id="advance">Next junction</button><a id="review" target="_blank" rel="noopener">Review concept (new tab)</a><button class="quiet" id="change" hidden>Change line</button></div></section>
  <noscript>This game needs JavaScript. <a href="./">Return to the concept map</a>.</noscript>
</div></div>
</main></div></body></html>
