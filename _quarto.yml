project:
  type: book
  output-dir: _site
  post-render: scripts/finish-site.py
  resources:
    - downloads/*.pdf
    - assets/mathjax-4.1.3/**

book:
  title: "Calculus notes"
  author: "Juan Salinas"
  description: "Notes, worked examples, and lecture PDFs for introductory differential calculus."
  site-url: https://juansalinas2.github.io/Math-1334---Calculus/
  search: true
  page-navigation: true
  sidebar:
    style: docked
    background: "#fafaf8"
    collapse-level: 1
  chapters:
    - href: index.qmd
      text: Overview
    - lectures/01-introduction.qmd
    - lectures/limits-and-continuity.qmd
    - lectures/02-limits.qmd
    - lectures/03-infinite-limits.qmd
    - lectures/04-limit-laws.qmd
    - lectures/05-squeeze-theorem.qmd
    - lectures/06-continuity.qmd
    - lectures/07-intermediate-value.qmd
    - supplements/limits-map.qmd
    - supplements/worksheets.qmd
    - supplements/glossary.qmd
    - supplements/self-checks.qmd
    - supplements/explore.qmd
    - lecture-pdfs.qmd
  appendices:
    - lectures/00-functions.qmd
  page-footer:
    left: "Calculus notes · Juan Salinas"
    right: "[Lecture PDFs](/lecture-pdfs.qmd)"

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: false
    number-sections: true
    number-depth: 0
    html-math-method:
      method: mathjax
      url: /assets/mathjax-4.1.3/tex-chtml.js
    lang: en
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      sidebar-width: 250px
      body-width: 760px
      margin-width: 40px
    include-after-body: assets/page-contents.html
    include-in-header: assets/reading-preferences.html
